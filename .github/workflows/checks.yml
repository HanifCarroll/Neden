name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: brew install qt cmake gitleaks
      - name: Scan all fetched history for secrets
        run: gitleaks git --redact --log-opts="--all"
      - name: Check layout and packaging helpers
        run: |
          python3 scripts/check_layout.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check desktop logic without playback or credentials
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt)"
          sh scripts/desktop.sh core-test
      - name: Check and package the IINA plugin
        run: |
          bun install --frozen-lockfile
          bun run release:check
