name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: brew install qt cmake gitleaks
      - name: Scan all fetched history for secrets
        run: gitleaks git --redact --log-opts="--all"
      - name: Check layout and packaging helpers
        run: |
          python3 scripts/check_layout.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check desktop logic without playback or credentials
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt)"
          sh scripts/desktop.sh core-test
      - name: Check and package the IINA plugin
        run: |
          bun install --frozen-lockfile
          bun run release:check
