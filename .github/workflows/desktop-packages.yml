name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson nasm pkg-config libass-dev libplacebo-dev libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libpulse-dev libasound2-dev libsecret-1-dev xvfb patchelf
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.10.2'
          modules: 'qtwebview qtwebengine qtwebchannel qtpositioning'
          cache: true
      - name: Build and verify LGPL playback
        run: bash scripts/build_linux_runtime.sh "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-sources"
      - name: Configure and build
        run: |
          cmake -S apps/desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DAUDITED_MPV_PREFIX="$RUNNER_TEMP/runtime" -DNEDEN_PACKAGE=ON
          cmake --build build/desktop --parallel 4
      - name: Test portable behavior and decoding
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/desktop --output-on-failure
      - name: Stage install
        run: |
          cmake --install build/desktop --prefix "$RUNNER_TEMP/Neden"
          tar -C "$RUNNER_TEMP" -czf Neden-linux-x86_64-preview.tar.gz Neden
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-package-candidate
          path: Neden-linux-x86_64-preview.tar.gz
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libass mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-python
      - name: Build LGPL playback
        shell: msys2 {0}
        run: bash scripts/release/build_windows_runtime.sh "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-sources"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: 'qtwebview'
          cache: true
      - name: Prepare runtime for MSVC
        shell: pwsh
        run: |
          $runtime = "$env:RUNNER_TEMP/runtime"
          $dll = Get-ChildItem "$runtime/bin/*mpv*.dll" | Select-Object -First 1
          $exports = & dumpbin /exports $dll.FullName
          $names = $exports | Where-Object { $_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(mpv_\w+)' } | ForEach-Object { $Matches[1] }
          if (!$names) { throw 'No libmpv C API exports found' }
          @("LIBRARY $($dll.Name)", 'EXPORTS') + $names | Set-Content "$runtime/mpv.def"
          lib /def:"$runtime/mpv.def" /out:"$runtime/lib/mpv.lib" /machine:x64
          # Dependency staging is narrowed and audited before release publication.
          Copy-Item C:/msys64/ucrt64/bin/*.dll "$runtime/bin" -Force
          "$runtime/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S apps/desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release "-DAUDITED_MPV_PREFIX=$env:RUNNER_TEMP/runtime" -DNEDEN_PACKAGE=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/desktop --parallel 4
          exit $LASTEXITCODE
      - name: Test portable behavior and decoding
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/desktop --output-on-failure
      - name: Stage install
        shell: pwsh
        run: |
          cmake --install build/desktop --prefix "$env:RUNNER_TEMP/Neden"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive "$env:RUNNER_TEMP/Neden" Neden-windows-x86_64-preview.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-package-candidate
          path: Neden-windows-x86_64-preview.zip
