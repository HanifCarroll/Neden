name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        type: choice
        options: [all, linux, windows, macos]
        default: all
permissions:
  contents: read
jobs:
  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson nasm pkg-config libass-dev libplacebo-dev libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libpulse-dev libasound2-dev libsecret-1-dev xvfb patchelf
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.10.2'
          modules: 'qtwebview qtwebengine qtwebchannel qtpositioning'
          cache: true
      - id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/runtime
            ${{ runner.temp }}/runtime-sources
          key: runtime-linux-v1-${{ hashFiles('scripts/build_linux_runtime.sh') }}
      - name: Build and verify LGPL playback
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_linux_runtime.sh "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-sources"
      - name: Configure and build
        run: |
          cmake -S apps/desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DAUDITED_MPV_PREFIX="$RUNNER_TEMP/runtime" -DNEDEN_PACKAGE=ON
          cmake --build build/desktop --parallel 4
      - name: Test portable behavior and decoding
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/desktop --output-on-failure
      - name: Stage install
        run: |
          cmake --install build/desktop --prefix "$RUNNER_TEMP/Neden"
          tar -C "$RUNNER_TEMP" -czf Neden-linux-x86_64-preview.tar.gz Neden
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-package-candidate
          path: Neden-linux-x86_64-preview.tar.gz
  windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libass mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-python
      - id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/runtime
            ${{ runner.temp }}/runtime-sources
          key: runtime-windows-v1-${{ hashFiles('scripts/release/build_windows_runtime.sh') }}
      - name: Build LGPL playback
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/release/build_windows_runtime.sh "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-sources"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: 'qtwebview'
          cache: true
      - name: Prepare runtime for MSVC
        shell: pwsh
        run: |
          $runtime = "$env:RUNNER_TEMP/runtime"
          ./scripts/release/stage_windows_runtime.ps1 -Runtime $runtime -MsysDirectory "${{ steps.msys2.outputs.msys2-location }}"
          "$runtime/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S apps/desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release "-DAUDITED_MPV_PREFIX=$env:RUNNER_TEMP/runtime" -DNEDEN_PACKAGE=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/desktop --parallel 4
          exit $LASTEXITCODE
      - name: Test portable behavior and decoding
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/desktop --output-on-failure
      - name: Stage install
        shell: pwsh
        run: |
          cmake --install build/desktop --prefix "$env:RUNNER_TEMP/Neden"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/runtime/bin/*.dll" "$env:RUNNER_TEMP/Neden/bin/"
          Compress-Archive "$env:RUNNER_TEMP/Neden" Neden-windows-x86_64-preview.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-package-candidate
          path: Neden-windows-x86_64-preview.zip
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.10.2'
          modules: 'qtwebview'
          cache: true
      - name: Fetch reviewed playback runtime
        run: |
          python3 scripts/fetch_macos_runtime.py
          mkdir -p .cache/mpv-headers/mpv
          for header in client.h render.h render_gl.h; do
            curl --fail --location "https://raw.githubusercontent.com/mpv-player/mpv/v0.36.0/libmpv/$header" -o ".cache/mpv-headers/mpv/$header"
          done
      - name: Configure and build
        run: |
          cmake -S apps/desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DMPV_INCLUDE_DIR="$PWD/.cache/mpv-headers" -DNEDEN_MPV_FRAMEWORKS="$PWD/.cache/playback-frameworks" -DNEDEN_SIGNING_IDENTITY=-
          cmake --build build/desktop --parallel 4
      - name: Test portable behavior and decoding
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/desktop --output-on-failure
      - name: Create and verify disk image
        run: python3 scripts/release/package_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-package-candidate
          path: dist/desktop/Neden-macos-arm64-preview.dmg
